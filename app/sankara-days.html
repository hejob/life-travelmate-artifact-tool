<title>Sankara Days</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap">
<style>
:root{
  --bg:#F7F6F1; --surface:#FFFFFF; --surface2:#EFEEE6;
  --ink:#1B241E; --ink2:#5A645C; --line:#DDE2DA;
  --moss:#3E6B4F; --moss-soft:#E3ECE4; --tide:#33627A; --cedar:#8A6D4B;
  --amber:#9A6A1B; --amber-soft:#F4E8D2;
  --now:#3E6B4F; --done:#9AA79D;
  --sea:#DCE7E9; --land:#EDEAE0; --landline:#D6D1C2;
  --shadow:0 1px 3px rgba(27,36,30,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A15; --surface:#1B231D; --surface2:#222B24;
    --ink:#E7EAE3; --ink2:#9DA89F; --line:#2E3830;
    --moss:#82B190; --moss-soft:#24352A; --tide:#84B4CC; --cedar:#C4A47C;
    --amber:#D9A84E; --amber-soft:#3A3120;
    --now:#82B190; --done:#5A665C;
    --sea:#162327; --land:#242C25; --landline:#33402F;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#131A15; --surface:#1B231D; --surface2:#222B24;
  --ink:#E7EAE3; --ink2:#9DA89F; --line:#2E3830;
  --moss:#82B190; --moss-soft:#24352A; --tide:#84B4CC; --cedar:#C4A47C;
  --amber:#D9A84E; --amber-soft:#3A3120;
  --now:#82B190; --done:#5A665C;
  --sea:#162327; --land:#242C25; --landline:#33402F;
  --shadow:0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
a{color:var(--tide)}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.serif{font-family:"Shippori Mincho","Hiragino Mincho ProN",serif}

/* header */
header{padding:14px 0 8px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;font-size:22px;font-weight:700;margin:0;letter-spacing:.02em}
.brand .sub{color:var(--ink2);font-size:12.5px}
.sync{margin-left:auto;font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--done)}
.sync.on .dot{background:var(--moss)}

/* day strip */
.strip{position:sticky;top:0;z-index:30;background:var(--bg);padding:6px 0 10px;border-bottom:1px solid var(--line)}
.strip-inner{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 14px;max-width:640px;margin:0 auto}
.strip-inner::-webkit-scrollbar{display:none}
.daychip{flex:0 0 auto;min-width:52px;padding:6px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:center}
.daychip .n{font-family:"Shippori Mincho",serif;font-size:17px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.daychip .w{font-size:10.5px;color:var(--ink2);letter-spacing:.05em}
.daychip.sel{background:var(--moss);border-color:var(--moss);color:#fff}
.daychip.sel .w{color:rgba(255,255,255,.85)}
.daychip.today:not(.sel){border-color:var(--moss);color:var(--moss)}
.daychip.today:not(.sel) .w{color:var(--moss)}

/* day header + now card */
.dayhead{margin:16px 0 4px}
.dayhead h2{font-family:"Shippori Mincho",serif;font-size:19px;margin:0;text-wrap:balance}
.dayhead .route{color:var(--ink2);font-size:13px;margin-top:2px}
.nowcard{margin:12px 0;background:var(--moss-soft);border:1px solid var(--moss);border-radius:14px;padding:11px 14px}
.nowcard .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--moss);font-weight:700}
.nowcard .t{font-weight:600;margin-top:2px}
.nowcard .m{font-size:13px;color:var(--ink2);margin-top:1px}

/* maps */
.map-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0 4px;background:var(--sea)}
.mp{display:block;width:100%;height:auto}
.mp-sea{fill:var(--sea)}
.mp-land{fill:var(--land);stroke:var(--landline);stroke-width:1}
.mp-route{fill:none;stroke:var(--moss);stroke-width:2.5;stroke-linejoin:round}
.mp-leg{fill:none;stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:4 4;opacity:.5}
.mp-leg.act{stroke:var(--moss);stroke-width:3;stroke-dasharray:none;opacity:1}
.mp-leglbl{font-size:11px;fill:var(--ink2);text-anchor:middle}
.mp-leglbl.act{fill:var(--moss);font-weight:700}
.mp-m.stop circle{fill:var(--moss);stroke:#fff;stroke-width:1.5}
.mp-m.idea circle{fill:var(--tide);stroke:#fff;stroke-width:1.2}
.mp-m.city circle{fill:var(--ink)}
.mp-m.ctx circle{fill:var(--ink2)}
.mp-n{fill:#fff;font-size:9.5px;font-weight:700;text-anchor:middle}
.mp-lbl{font-size:10px;fill:var(--ink);stroke:var(--sea);stroke-width:2.5;paint-order:stroke;stroke-linejoin:round}
.mp-m.city .mp-lbl{font-size:11.5px;font-weight:700}
.mp-m.ctx .mp-lbl{fill:var(--ink2);font-size:9px}
.map-cap{font-size:11px;color:var(--ink2);margin:0 0 10px}

/* timeline */
.tl{margin:10px 0 24px;display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow)}
.ev.now{border-color:var(--now);border-width:1.5px}
.ev.past{opacity:.62}
.ev.done .title{text-decoration:line-through;color:var(--done)}
.ev .time{flex:0 0 52px;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;line-height:1.4;padding-top:2px;white-space:pre-line}
.ev .body{flex:1;min-width:0}
.ev .title{font-weight:600;font-size:15.5px}
.jp{color:var(--ink2);font-weight:400;font-size:13.5px}
.ev .note{font-size:13px;color:var(--ink2);margin-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2.5px 9px;background:var(--surface2);color:var(--ink);text-decoration:none}
.chip svg{width:11px;height:11px;flex:none}
.chip.map{color:var(--tide);border-color:color-mix(in srgb,var(--tide) 35%,transparent)}
.chip.site{color:var(--moss);border-color:color-mix(in srgb,var(--moss) 35%,transparent)}
.chip.trans{color:var(--cedar)}
.chip.fl{color:var(--tide);border-color:color-mix(in srgb,var(--tide) 45%,transparent);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.chip.flag{color:var(--amber);background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 40%,transparent);font-weight:600}
.chip.askbtn{color:var(--moss);border-color:var(--moss);font-weight:600}
.tick{flex:0 0 26px;align-self:flex-start;padding-top:2px}
.tick span{display:block;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);position:relative}
.ev.done .tick span{background:var(--moss);border-color:var(--moss)}
.ev.done .tick span::after{content:"";position:absolute;left:6px;top:3.5px;width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg)}

/* tabs content */
.pane{display:none}
.pane.sel{display:block}
h3.sec{font-family:"Shippori Mincho",serif;font-size:16px;margin:20px 0 8px}

/* ideas + generic filter chips */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.fchip{font-size:12.5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;color:var(--ink2)}
.fchip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters .lbl{width:100%;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-top:6px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;gap:10px}
.idea .num{flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:var(--tide);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.idea .bd{flex:1;min-width:0}
.idea .title{font-weight:600;font-size:15px}
.idea .note{font-size:13px;color:var(--ink2);margin-top:2px}

/* ask */
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.msg{max-width:88%;border-radius:14px;padding:9px 13px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--moss);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.bot.thinking{color:var(--ink2);font-style:italic}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.askbar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);padding:8px 14px;display:none}
.askbar.sel{display:block}
.askbar .row{max-width:640px;margin:0 auto;display:flex;gap:8px}
.askbar textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit;font-size:14.5px;max-height:96px}
.askbar .go{background:var(--moss);color:#fff;border-radius:12px;padding:0 16px;font-weight:600}
.askbar .go.stop{background:var(--amber)}
.askoff{color:var(--ink2);font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}

/* notes */
.notebar{display:flex;gap:6px;margin:14px 0 6px}
.notebar input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit;font-size:14.5px}
.notebar select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 6px;font:inherit;font-size:13px;max-width:96px}
.notebar button{background:var(--moss);color:#fff;border-radius:12px;padding:0 14px;font-weight:600}
.note-item{display:flex;gap:9px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px}
.note-item.done .txt{text-decoration:line-through;color:var(--done)}
.note-item .ntick{flex:0 0 22px;padding-top:1px}
.note-item .ntick span{display:block;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);position:relative}
.note-item.done .ntick span{background:var(--moss);border-color:var(--moss)}
.note-item.done .ntick span::after{content:"";position:absolute;left:5.5px;top:2.5px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg)}
.note-item .bd{flex:1;min-width:0}
.note-item .txt{font-size:14.5px;overflow-wrap:break-word}
.note-item .sub{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.note-item .tagchip{font-size:10.5px;border-radius:999px;padding:1.5px 8px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);font-weight:600;letter-spacing:.03em}
.note-item .tagchip.todo{color:var(--amber);background:var(--amber-soft)}
.note-item .tagchip.buy{color:var(--cedar)}
.note-item .tagchip.idea{color:var(--moss)}
.note-item .tagchip.later{color:var(--tide)}
.note-item .when{font-size:11px;color:var(--ink2)}
.note-item .act{color:var(--ink2);font-size:14px;padding:0 4px;flex:none}
.note-item .editbox{width:100%;border:1px solid var(--moss);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 9px;font:inherit;font-size:14.5px}
.showdone{margin:6px 0 14px}

/* info */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card .t{font-weight:600}
.card .jp2{color:var(--ink2);font-size:13px}
.card .d{font-size:13px;color:var(--ink2);margin-top:2px}
.checkrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.checkrow:last-child{border-bottom:none}
.checkrow .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;position:relative}
.checkrow.on .box{background:var(--moss);border-color:var(--moss)}
.checkrow.on .box::after{content:"";position:absolute;left:5.5px;top:2.5px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg)}
.checkrow.on{color:var(--done);text-decoration:line-through}

/* conditions strip (sun + tide) */
.cond{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.cond .c{display:inline-flex;align-items:baseline;gap:5px;font-size:12px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.cond .c b{font-weight:700;color:var(--ink);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.cond .c.tide{border-color:color-mix(in srgb,var(--tide) 35%,transparent)}
.cond .c.tide b{color:var(--tide)}
.cond .src{font-size:11px;color:var(--ink2);width:100%;margin-top:3px;line-height:1.45}
.dayhead .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}

/* emergency card */
.card.emerg{border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:var(--amber-soft)}
.erow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--amber) 28%,transparent)}
.erow:last-child{border-bottom:none}
.erow .en{font-weight:600;font-size:14.5px}
.erow .ejp{color:var(--ink2);font-size:12.5px}
.erow .etel{margin-left:auto;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--amber)}
.erow .etel.off{color:var(--ink2);font-weight:400;font-size:13px}
.erow .enote{width:100%;font-size:12.5px;color:var(--ink2);margin-top:1px}
.erow .emap{margin-top:4px}

/* bookings */
.brow{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:none}
.brow .bk{flex:0 0 38%;font-size:12.5px;color:var(--ink2);line-height:1.35}
.brow .bv{flex:1;min-width:0;font-size:14px;overflow-wrap:break-word;cursor:pointer}
.brow .bv.empty{color:var(--done)}
.brow input{width:100%;border:1px solid var(--moss);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 8px;font:inherit;font-size:14px}

/* text sheet (offline copy-out) */
.sheet{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);z-index:45;padding:10px 14px 12px;display:none;box-shadow:0 -8px 24px rgba(0,0,0,.14)}
.sheet.on{display:block}
.sheet .inner{max-width:640px;margin:0 auto}
.sheet .hd{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.sheet .hd strong{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .hd .sp{margin-left:auto}
.sheet textarea{width:100%;height:32vh;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 11px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:none}
.sheet .hint{font-size:11.5px;color:var(--ink2);margin-top:6px}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav .row{max-width:640px;margin:0 auto;display:flex}
nav button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink2);letter-spacing:.03em}
nav button svg{width:21px;height:21px}
nav button.sel{color:var(--moss);font-weight:600}
.backup-note{font-size:12.5px;color:var(--ink2);margin:8px 0 16px}
@media (prefers-reduced-motion: no-preference){
  .pane.sel{animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
}
@media print{
  nav,.strip,.askbar,.sheet,.dayhead .acts,header .sync{display:none}
  body{padding-bottom:0;background:#fff;color:#000}
}
</style>

<div class="wrap">
<header>
  <div class="brand">
    <h1>Sankara Days</h1>
    <span class="sub serif">那覇 · 福岡 · 屋久島 — Sep 3–11</span>
    <span class="sync" id="sync"><span class="dot"></span><span id="syncTxt">local</span></span>
  </div>
</header>
</div>

<div class="strip" id="strip"><div class="strip-inner" id="stripInner"></div></div>

<div class="wrap">
  <div class="pane sel" id="pane-plan"></div>
  <div class="pane" id="pane-ideas">
    <div class="filters" id="ideaFilters"></div>
    <div id="ideaMap"></div>
    <div id="ideaList"></div>
  </div>
  <div class="pane" id="pane-ask">
    <div id="askOff" class="askoff" hidden>Ask needs the Claude viewer with sampling enabled on this account — it isn't available here. The rest of the app works as usual.</div>
    <div class="filters" id="askDays"></div>
    <div class="chat" id="chat"></div>
    <div class="suggest" id="suggest"></div>
  </div>
  <div class="pane" id="pane-notes">
    <div class="notebar">
      <input id="noteInput" placeholder="Quick note…" maxlength="500">
      <select id="noteTag"></select>
      <button id="noteAdd">Add</button>
    </div>
    <div class="filters" id="noteFilters"></div>
    <div id="noteList"></div>
    <button class="fchip showdone" id="showDoneBtn"></button>
  </div>
  <div class="pane" id="pane-info"></div>
</div>

<div class="askbar" id="askbar">
  <div class="row">
    <textarea id="askInput" rows="1" placeholder="Ask about the trip, places, food…"></textarea>
    <button class="go" id="askGo">Ask</button>
  </div>
</div>

<div class="sheet" id="sheet"><div class="inner">
  <div class="hd">
    <strong id="sheetTitle"></strong>
    <span class="sp"></span>
    <button class="fchip" id="sheetCopy">Copy</button>
    <button class="fchip" id="sheetClose">Close</button>
  </div>
  <textarea id="sheetText" readonly spellcheck="false"></textarea>
  <div class="hint" id="sheetHint"></div>
</div></div>

<nav><div class="row">
  <button data-tab="plan" class="sel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="ideas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Ideas</button>
  <button data-tab="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>Ask</button>
  <button data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6"/></svg>Notes</button>
  <button data-tab="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Info</button>
</div></nav>

<script>
"use strict";
const LITE=false; /* build-lite.sh flips this: Lite build has no Claude capabilities and hides the Ask tab */
/* ---------------- helpers ---------------- */
const M = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const GLOBE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18-2.5-2.7-2.5-15.3 0-18z"/></svg>';
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function lsGet(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function jstISO(){return new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Tokyo"}).format(new Date())}

function fitProj(area,extraPts){
  const A=AREAS[area];
  let la0=A.base[0][0],lo0=A.base[0][1],la1=A.base[1][0],lo1=A.base[1][1];
  for(const p of extraPts||[]){la0=Math.min(la0,p[0]);la1=Math.max(la1,p[0]);lo0=Math.min(lo0,p[1]);lo1=Math.max(lo1,p[1]);}
  const pa=(la1-la0)*0.09,po=(lo1-lo0)*0.09;
  la0-=pa;la1+=pa;lo0-=po;lo1+=po;
  const W=600,k=Math.cos((la0+la1)/2*Math.PI/180);
  let H=Math.round(W*(la1-la0)/((lo1-lo0)*k));
  H=Math.max(180,Math.min(460,H));
  return {W,H,x:g=>(g-lo0)/(lo1-lo0)*W,y:t=>(la1-t)/(la1-la0)*H};
}
function polyPath(pr,pts){return pts.map((p,i)=>(i?"L":"M")+pr.x(p[1]).toFixed(1)+" "+pr.y(p[0]).toFixed(1)).join("")+"Z"}
function marker(pr,ll,n,label,cls,q,la,ld){
  const x=pr.x(ll[1]),y=pr.y(ll[0]);
  const r=cls==="stop"?8:cls==="idea"?7.5:cls==="city"?5:3.2;
  const end=la==="end";
  const dy=(ld||0);
  let m=`<g class="mp-m ${cls}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}"/>`;
  if(n!=null)m+=`<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" class="mp-n">${n}</text>`;
  if(label)m+=`<text x="${(end?x-r-3:x+r+3).toFixed(1)}" y="${(y+3.5+dy).toFixed(1)}" class="mp-lbl"${end?' text-anchor="end"':""}>${esc(label)}</text>`;
  m+="</g>";
  return q?`<a href="${M(q)}" target="_blank" rel="noopener">${m}</a>`:m;
}
function mapSVG(spec){
  const extra=[];
  (spec.stops||[]).forEach(k=>extra.push(PL[k].ll));
  (spec.ctx||[]).forEach(k=>extra.push(PL[k].ll));
  (spec.ideas||[]).forEach(i=>extra.push(i.ll));
  const pr=fitProj(spec.area,extra);
  let s=`<svg viewBox="0 0 ${pr.W} ${pr.H}" class="mp" role="img" aria-label="schematic map">`;
  s+=`<rect width="${pr.W}" height="${pr.H}" class="mp-sea"/>`;
  for(const Lp of AREAS[spec.area].lands) s+=`<path d="${polyPath(pr,Lp)}" class="mp-land"/>`;
  if(spec.area==="ov"){
    LEGS.forEach((lg,i)=>{
      const a=PL[lg.f].ll,b=PL[lg.t].ll;
      const x1=pr.x(a[1]),y1=pr.y(a[0]),x2=pr.x(b[1]),y2=pr.y(b[0]);
      const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;
      const cx=(x1+x2)/2-dy/L*L*0.16*lg.bend, cy=(y1+y2)/2+dx/L*L*0.16*lg.bend;
      const act=spec.leg==null||spec.leg===i;
      s+=`<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" class="mp-leg${act?" act":""}"/>`;
      const tx=(x1+2*cx+x2)/4,ty=(y1+2*cy+y2)/4;
      s+=`<text x="${tx.toFixed(1)}" y="${(ty-5).toFixed(1)}" class="mp-leglbl${act?" act":""}">${lg.d}</text>`;
    });
    ["naha_c","fuk_c","yaku_c"].forEach(k=>{const p=PL[k];s+=marker(pr,p.ll,null,p.l,"city",null,p.la,p.ld);});
  }
  const stops=(spec.stops||[]).map(k=>PL[k]);
  if(stops.length>1){
    s+=`<path d="${stops.map((p,i)=>(i?"L":"M")+pr.x(p.ll[1]).toFixed(1)+" "+pr.y(p.ll[0]).toFixed(1)).join("")}" class="mp-route"/>`;
  }
  (spec.ctx||[]).forEach(k=>{const p=PL[k];s+=marker(pr,p.ll,null,p.l,"ctx",p.q,p.la,p.ld);});
  const lastDup=stops.length>2&&spec.stops[0]===spec.stops[spec.stops.length-1];
  stops.forEach((p,i)=>{
    if(lastDup&&i===stops.length-1)return;
    s+=marker(pr,p.ll,i+1,p.l,"stop",p.q||p.l,p.la,p.ld);
  });
  (spec.ideas||[]).forEach((it,i)=>{s+=marker(pr,it.ll,i+1,it.name,"idea",it.mapq,it.la,it.ld);});
  s+="</svg>";
  return `<div class="map-wrap">${s}</div>`;
}

/* ---------------- sun + tide ---------------- */
function hm(t){const p=t.split(":");return (+p[0])*60+(+p[1]);}
function mh(x){x=((x%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");}
function tideWindows(iso){
  /* bathable stretch around each low tide, clamped to daylight; drops windows with no daylight left */
  const td=TIDE[iso], su=SUN[iso];
  if(!td) return [];
  const out=[];
  for(const t of td.lo){
    let a=hm(t)-120, b=hm(t)+120;
    if(su){ a=Math.max(a,hm(su.r)); b=Math.min(b,hm(su.s)); }
    if(td.from) a=Math.max(a,hm(td.from));   /* not on the island yet */
    if(td.to)   b=Math.min(b,hm(td.to));     /* already leaving for the airport */
    if(b-a>=30) out.push(mh(a)+"\u2013"+mh(b));
  }
  return out;
}
function condStrip(d){
  const su=SUN[d.iso], td=TIDE[d.iso];
  if(!su&&!td) return "";
  let out="";
  if(su) out+=`<span class="c"><b>Sun</b> ${su.r} \u2013 ${su.s} <span class="jp">${esc(su.at)}</span></span>`;
  if(td){
    out+=`<span class="c tide"><b>Low tide</b> ${td.lo.join(" \u00b7 ")}</span>`;
    const w=tideWindows(d.iso);
    if(w.length) out+=`<span class="c tide"><b>Hirauchi</b> ${w.join(" \u00b7 ")}</span>`;
  }
  return `<div class="cond">${out}${td?`<span class="src">${esc(TIDE_SRC)}</span>`:""}</div>`;
}

/* ---------------- offline text ---------------- */
function dayText(d){
  const su=SUN[d.iso], td=TIDE[d.iso];
  let s=`\u2500\u2500 Sep ${d.n} (${d.dow}) \u2014 ${d.title}\n${d.route}\n`;
  if(su) s+=`Sun ${su.r}\u2013${su.s} (${su.at})\n`;
  if(td){
    s+=`Low tide ${td.lo.join(", ")} | High ${td.hi.join(", ")}\n`;
    const w=tideWindows(d.iso);
    if(w.length) s+=`Hirauchi onsen window ${w.join(", ")}\n`;
  }
  s+="\n";
  for(const ev of d.events){
    const t=(ev.time||"").replace("\n","\u2013");
    s+=`[${t}] ${ev.title}${ev.flno?"  ("+ev.flno+")":""}${ev.jp?"  "+ev.jp:""}\n`;
    s+=`    ${ev.loc}${ev.trans&&ev.trans!=="\u2014"?"  \u00b7  "+ev.trans:""}\n`;
    if(ev.note) s+=`    ${ev.note}\n`;
    if(ev.flag) s+=`    [!] ${ev.flag}\n`;
  }
  return s;
}
function tripText(){
  let s=`SANKARA DAYS \u2014 Sep 3\u201311, 2026 \u00b7 all times JST\nSaved ${jstStamp()}\n\n`;
  s+=DAYS.map(dayText).join("\n");
  s+=`\n\u2500\u2500 HOTELS\n`;
  s+=HOTELS.map(h=>`${h.name}  ${h.jp}\n    ${h.d}\n    TEL ${h.tel}`).join("\n")+"\n";
  s+=`\n\u2500\u2500 EMERGENCY & LOGISTICS\n`;
  s+=EMERG.map(e=>`${e.t}${e.jp?"  "+e.jp:""} \u2014 ${e.tel||"(add number)"}${e.n?"\n    "+e.n:""}`).join("\n")+"\n";
  s+=`\n\u2500\u2500 BOOKINGS\n`;
  s+=BOOKINGS.map(b=>`${b.t}: ${bookings[b.id]||"\u2014"}`).join("\n")+"\n";
  s+=`\n\u2500\u2500 CHECKLIST\n`;
  s+=CHECKLIST.map(c=>`[${checks[c.id]?"x":" "}] ${c.t}`).join("\n")+"\n";
  return s;
}
function openSheet(title,text,hint){
  $("sheetTitle").textContent=title;
  $("sheetText").value=text;
  $("sheetHint").textContent=hint||"Copy this into your phone\u2019s Notes or LINE \u2014 it stays readable with no signal.";

/* ---------------- day strip ---------------- */
function buildStrip(){
  const today=jstISO();
  $("stripInner").innerHTML=DAYS.map(d=>
    `<button class="daychip${d.iso===curDay?" sel":""}${d.iso===today?" today":""}" data-day="${d.iso}">
      <div class="n">${d.n}</div><div class="w">${d.dow}</div></button>`).join("");
  $("stripInner").querySelectorAll(".daychip").forEach(b=>b.onclick=()=>{curDay=b.dataset.day;setTab("plan");buildStrip();renderPlan();});
}

/* ---------------- plan ---------------- */
function evStatus(d,ev){
  const today=jstISO(), now=jstMin();
  if(checks[ev.id]) return "done";
  if(d.iso<today) return "past";
  if(d.iso>today) return "";
  if(ev.e!=null&&ev.e<=now) return "past";
  if(ev.s!=null&&ev.s<=now&&(ev.e==null||now<ev.e)) return "now";
  return "";
}
function dayMaps(d){ return (d.maps||[]).map(mapSVG).join("")+((d.maps&&d.maps.length)?MAP_CAP:""); }
function renderPlan(){
  const d=DAYS.find(x=>x.iso===curDay)||DAYS[0];
  const today=jstISO(), now=jstMin();
  let nowCard="";
  if(d.iso===today){
    const cur=d.events.find(ev=>ev.s!=null&&ev.s<=now&&ev.e!=null&&now<ev.e);
    const nxt=d.events.find(ev=>ev.s!=null&&ev.s>now);
    const pick=cur||nxt;
    if(pick){
      const h=Math.floor((pick.s-now)/60), m=(pick.s-now)%60;
      const lead=cur?"Happening now":"Up next"+(pick.s>now?` · in ${h>0?h+" h ":""}${m} min`:"");
      nowCard=`<div class="nowcard"><div class="k">${lead}</div><div class="t">${esc(pick.title)} <span class="jp">${esc(pick.jp||"")}</span></div><div class="m">${esc(pick.time.replace("\n"," – "))} · ${esc(pick.loc)}${pick.trans&&pick.trans!=="—"?" · "+esc(pick.trans):""}</div></div>`;
    }
  }
  $("pane-plan").innerHTML=`
    <div class="dayhead"><h2>Sep ${d.n} (${d.dow}) — ${esc(d.title)}</h2><div class="route">${esc(d.route)}</div>
      <div class="acts"><button class="fchip" id="copyDay">⤓ Save this day offline</button></div>
    </div>
    ${condStrip(d)}
    ${nowCard}
    ${dayMaps(d)}
    <div class="tl">${d.events.map(ev=>evHTML(d,ev)).join("")}</div>`;
  bindEvents($("pane-plan"));
  $("copyDay").onclick=()=>openSheet(`Sep ${d.n} — ${d.title}`,dayText(d));
}
function evHTML(d,ev){
  const st=evStatus(d,ev);
  const flags={tbd:"to decide",reserve:"book needed",confirm:"confirm time",decide:"flexible"};
  const pin='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  return `<div class="ev ${st}" data-ev="${ev.id}">
    <div class="time">${esc(ev.time||"")}</div>
    <div class="body">
      <div class="title">${esc(ev.title)} <span class="jp">${esc(ev.jp||"")}</span></div>
      ${ev.note?`<div class="note">${esc(ev.note)}</div>`:""}
      <div class="meta">
        <a class="chip map" target="_blank" rel="noopener" href="${M(ev.mapq||ev.loc)}">${pin}${esc(ev.loc)}</a>
        ${ev.site?`<a class="chip site" target="_blank" rel="noopener" href="${ev.site}">${GLOBE}Official</a>`:""}
        ${ev.flno?`<span class="chip fl">✈ ${esc(ev.flno)}</span>`:""}
        ${ev.trans&&ev.trans!=="—"?`<span class="chip trans">${esc(ev.trans)}</span>`:""}
        ${ev.flag?`<span class="chip flag">⚑ ${flags[ev.flag]||ev.flag}</span>`:""}
        ${ev.ideas?`<button class="chip" data-ideas="${ev.ideas}">Ideas ›</button>`:""}
        ${ev.ask&&!LITE?`<button class="chip askbtn" data-ask="${esc(ev.ask)}">Ask Claude</button>`:""}
      </div>
    </div>
    <button class="tick" data-tick="${ev.id}" aria-label="mark done"><span></span></button>
  </div>`;
}
function bindEvents(root){
  root.querySelectorAll("[data-tick]").forEach(b=>b.onclick=()=>toggleCheck(b.dataset.tick));
  root.querySelectorAll("[data-ideas]").forEach(b=>b.onclick=()=>{ideaArea=b.dataset.ideas;ideaTag=null;setTab("ideas");});
  root.querySelectorAll("[data-ask]").forEach(b=>b.onclick=()=>{setTab("ask");$("askInput").value=b.dataset.ask;$("askInput").focus();});
}

/* ---------------- ask ---------------- */
function tripBrief(){
  let s="ITINERARY (Sep 2026, all times JST):\n";
  for(const d of DAYS){
    s+=`Sep ${d.n} ${d.dow} — ${d.title}: `;
    s+=d.events.map(e=>`${e.time?e.time.replace("\n","-")+" ":""}${e.title}${e.flag?" ["+e.flag+"]":""}`).join("; ")+"\n";
  }
  s+="Hotels: "+HOTELS.map(h=>h.name+" ("+h.d+")").join("; ")+".\n";
  return s;
}
function askRules(){
  return "You are the pocket travel copilot for a 2-person family trip: Naha → Fukuoka → Yakushima (sankara hotel&spa, Mugio) → Fukuoka → Naha, Sep 3–11, 2026. Current time: "+jstStamp()+".\n\n"
  +tripBrief()
  +"\nAnswer for a phone screen: short, concrete, decision-ready. Recommend specific named places with Japanese names in parentheses, realistic travel times, and opening-hours cautions. September is typhoon season — mention weather checks when relevant. If unsure about current facts (hours, closures), say to verify locally. No markdown headers; plain text with short lines or dashes.";
}
function renderSuggest(){
  if(LITE){$("askOff").hidden=false;$("askDays").innerHTML="";$("suggest").innerHTML="";return;}
  $("askDays").innerHTML=`<div class="lbl">Day recommendations</div>`+
    DAYS.map(d=>`<button class="fchip" data-d="${d.n}">9/${d.n}</button>`).join("");
  $("askDays").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
    const d=DAYS.find(x=>x.n===b.dataset.d);
    sendAskText(`Give recommendations for Sep ${d.n} (${d.title}). Focus on the unplanned/free time and pending decisions in that day's schedule; suggest 3–5 concrete options with times that fit around the fixed items and short travel from where we are that day. Include Japanese names.`);
  });
  const sug=["Fill the free slot on Sep 8","Where should we book the Sep 9 dinner with friends?","Rainy-day plan on Yakushima","What to do near the Hilton Sea Hawk tonight?"];
  $("suggest").innerHTML=askTurns.length?"":sug.map(t=>`<button class="fchip" data-s="${esc(t)}">${esc(t)}</button>`).join("");
  $("suggest").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sendAskText(b.dataset.s);});
}
function addMsg(cls,text){
  const el=document.createElement("div");
  el.className="msg "+cls; el.textContent=text;
  $("chat").appendChild(el);
  el.scrollIntoView({block:"end",behavior:"auto"});
  return el;
}
function sendAsk(){
  if(askBusy){ askCtl&&askCtl.abort(); return; }
  const q=$("askInput").value.trim();
  if(!q) return;
  $("askInput").value="";
  sendAskText(q);
}
async function sendAskText(q){
  if(askBusy) return;
  if(!sampleFn||sampleDead){ $("askOff").hidden=false; return; }
  askTurns.push({role:"user",content:q});
  while(askTurns.length>14) askTurns.splice(0,2);
  addMsg("user",q);
  const bubble=addMsg("bot thinking","Thinking…");
  askBusy=true; $("askGo").textContent="Stop"; $("askGo").classList.add("stop");
  renderSuggest();
  askCtl=new AbortController();
  try{
    const {text}=await sampleFn([{role:"user",content:askRules()},...askTurns],{
      cache:false, signal:askCtl.signal,
      onText:({text})=>{bubble.classList.remove("thinking");bubble.textContent=text;bubble.scrollIntoView({block:"end"});}
    });
    bubble.classList.remove("thinking"); bubble.textContent=text;
    askTurns.push({role:"assistant",content:text});
  }catch(e){
    bubble.classList.remove("thinking");
    if(e&&e.code==="cancelled"){
      if(e.text){bubble.textContent=e.text;askTurns.push({role:"assistant",content:e.text});}
      else{bubble.remove();askTurns.pop();}
    }else if(e&&["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)){
      sampleDead=true; bubble.remove(); askTurns.pop(); $("askOff").hidden=false;
    }else if(e&&e.code==="refused"){
      bubble.textContent="Claude declined that one — try rephrasing."; askTurns.pop();
    }else if(e&&e.code==="rate_limited"){
      bubble.textContent=(e.text?e.text+"\n\n":"")+"⚠ Rate limited — wait a bit and try again."; askTurns.pop();
    }else{
      bubble.textContent=(e&&e.text?e.text+"\n\n":"")+"⚠ Connection hiccup — try again."; askTurns.pop();
    }
  }finally{
    askBusy=false; askCtl=null;
    $("askGo").textContent="Ask"; $("askGo").classList.remove("stop");
    bubble.scrollIntoView({block:"end"});
  }
}

/* ---------------- notes ---------------- */
function noteWrite(n){ /* persist one note (upsert) */
  if(notesCol){ notesCol.doc(n.id).set({text:n.text,ts:n.ts,tag:n.tag,done:!!n.done}).catch(()=>{}); }
  else{ lsSet("notes",notes); renderNotes(); }
}
function renderNotes(){
  const usedTags=[...new Set(notes.map(n=>n.tag||"memo"))];
  $("noteFilters").innerHTML=`<button class="fchip${!noteTagFilter?" sel":""}" data-t="">All</button>`+
    NOTE_TAGS.filter(([k])=>usedTags.includes(k)).map(([k,l])=>`<button class="fchip${noteTagFilter===k?" sel":""}" data-t="${k}">${l}</button>`).join("");
  $("noteFilters").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{noteTagFilter=b.dataset.t||null;renderNotes();});
  const vis=notes.filter(n=>(showDone||!n.done)&&(!noteTagFilter||(n.tag||"memo")===noteTagFilter));
  const doneN=notes.filter(n=>n.done).length;
  $("showDoneBtn").textContent=showDone?`Hide checked (${doneN})`:`Show checked (${doneN})`;
  $("showDoneBtn").hidden=doneN===0;
  $("noteList").innerHTML=vis.length?vis.map(n=>{
    const dt=new Date(n.ts).toLocaleString("en-GB",{timeZone:"Asia/Tokyo",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
    const tag=n.tag||"memo";
    const tl=(NOTE_TAGS.find(x=>x[0]===tag)||["memo","Memo"])[1];
    const body=editingNote===n.id
      ?`<input class="editbox" id="editBox" value="${esc(n.text)}" maxlength="500">`
      :`<div class="txt">${esc(n.text)}</div>`;
    return `<div class="note-item${n.done?" done":""}" data-id="${esc(n.id)}">
      <button class="ntick" data-ndone="${esc(n.id)}" aria-label="check note"><span></span></button>
      <div class="bd">${body}
        <div class="sub"><span class="tagchip ${tag}">${tl}</span><span class="when">${dt}</span></div>
      </div>
      ${editingNote===n.id
        ?`<button class="act" data-nsave="${esc(n.id)}">✔</button>`
        :`<button class="act" data-nedit="${esc(n.id)}">✎</button>`}
      <button class="act" data-ndel="${esc(n.id)}">✕</button>
    </div>`;
  }).join(""):`<div class="backup-note">${notes.length?"Nothing here — change the filter or show checked notes.":"Shared notes both of you can see — drop links, room numbers, to-dos, anything. Tag them to keep sorted."}</div>`;
  $("noteList").querySelectorAll("[data-ndone]").forEach(b=>b.onclick=()=>{
    const n=notes.find(x=>x.id===b.dataset.ndone); if(!n)return;
    n.done=!n.done; noteWrite(n); if(!notesCol)renderNotes();
  });
  $("noteList").querySelectorAll("[data-ndel]").forEach(b=>b.onclick=()=>{
    if(notesCol){ notesCol.doc(b.dataset.ndel).delete().catch(()=>{}); }
    else{ notes=notes.filter(n=>n.id!==b.dataset.ndel); lsSet("notes",notes); renderNotes(); }
  });
  $("noteList").querySelectorAll("[data-nedit]").forEach(b=>b.onclick=()=>{
    editingNote=b.dataset.nedit; renderNotes();
    const box=$("editBox"); if(box){box.focus();box.setSelectionRange(box.value.length,box.value.length);
      box.addEventListener("keydown",e=>{if(e.key==="Enter")saveEdit();if(e.key==="Escape"){editingNote=null;renderNotes();}});}
  });
  $("noteList").querySelectorAll("[data-nsave]").forEach(b=>b.onclick=saveEdit);
}
function saveEdit(){
  const box=$("editBox"); if(!box){editingNote=null;renderNotes();return;}
  const n=notes.find(x=>x.id===editingNote);
  const t=box.value.trim();
  editingNote=null;
  if(n&&t&&t!==n.text){ n.text=t; noteWrite(n); }
  renderNotes();
}
function addNote(){
  const t=$("noteInput").value.trim();
  if(!t)return;
  $("noteInput").value="";
  const n={id:"n"+Date.now()+Math.random().toString(36).slice(2,6),text:t,ts:Date.now(),tag:$("noteTag").value,done:false};
  if(notesCol){ notesCol.doc(n.id).set({text:n.text,ts:n.ts,tag:n.tag,done:false}).catch(()=>{}); }
  else{ notes.unshift(n); lsSet("notes",notes); renderNotes(); }
}

    <div class="d" style="margin-top:6px">Times checked against the JAL/JTA timetable — reconfirm at online check-in.</div>
    <div class="d" style="margin-top:6px">Rental car on Yakushima: Sep 6 (9–15), Sep 7 (10–15), Sep 8 (10–16)</div>
    <div class="d">Own car: drive from 13:30 Sep 3, to Toyota Naha 16:00 → pick up Sep 11, 13:00</div>
  </div>
  <h3 class="sec">Checklist <span class="jp2" style="font-weight:400">(shared)</span></h3>
  <div class="card" id="checklist">
    ${CHECKLIST.map(c=>`<div class="checkrow${checks[c.id]?" on":""}" data-chk="${c.id}"><span class="box"></span><span>${esc(c.t)}</span></div>`).join("")}
  </div>
  <h3 class="sec">Useful links</h3>
  <div class="card">${LINKS.map(l=>`<div class="d" style="margin:4px 0"><a target="_blank" rel="noopener" href="${l.u}">${esc(l.t)}</a></div>`).join("")}</div>
  <h3 class="sec">Offline backup</h3>
  <div class="filters" style="margin-top:0">
    <button class="fchip" id="copyTrip">⤓ Copy whole trip as text</button>
    <button class="fchip" id="copyToday">⤓ Copy today only</button>
    <button class="fchip" id="printBtn">Print view (all days)</button>
  </div>
  <div class="backup-note">Yakushima's mountains have weak signal, and this page needs the network to load at all. Copy the text into your phone's Notes or LINE — that survives with no signal. The print view is for a PDF/screenshot backup: Share → Print.</div>`;
  $("pane-info").querySelectorAll("[data-chk]").forEach(r=>r.onclick=()=>toggleCheck(r.dataset.chk));
  $("pane-info").querySelectorAll("[data-bedit]").forEach(c=>c.onclick=()=>{
    editingBk=c.dataset.bedit; renderInfo();
    const box=$("bkBox");
    if(box){
      box.focus(); box.setSelectionRange(box.value.length,box.value.length);
      box.addEventListener("keydown",e=>{
        if(e.key==="Enter"){e.preventDefault();bkSave();}
        if(e.key==="Escape"){editingBk=null;renderInfo();}
      });
      box.addEventListener("blur",()=>{ if(editingBk) bkSave(); });
    }
  });
  $("copyTrip").onclick=()=>openSheet("Whole trip",tripText());
  $("copyToday").onclick=()=>{
    const d=DAYS.find(x=>x.iso===jstISO())||DAYS.find(x=>x.iso===curDay)||DAYS[0];
    openSheet(`Sep ${d.n} — ${d.title}`,dayText(d));
  };
  $("printBtn").onclick=()=>{
    setTab("plan");
    const w=$("pane-plan");
    w.innerHTML=DAYS.map(d=>`
      <div class="dayhead"><h2>Sep ${d.n} (${d.dow}) — ${esc(d.title)}</h2><div class="route">${esc(d.route)}</div></div>
      ${condStrip(d)}
      ${dayMaps(d)}
      <div class="tl">${d.events.map(ev=>evHTML(d,ev)).join("")}</div>`).join("");
    bindEvents(w);
    window.scrollTo(0,0);
  };
}

/* ---------------- tabs ---------------- */
function setTab(t){
  curTab=t;
  $("sheet").classList.remove("on");
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("sel",p.id==="pane-"+t));
  document.querySelectorAll("nav [data-tab]").forEach(b=>b.classList.toggle("sel",b.dataset.tab===t));
  $("askbar").classList.toggle("sel",t==="ask"&&!LITE);
  $("strip").style.display=(t==="plan")?"":"none";
  if(t==="plan")renderPlan();
  if(t==="ideas")renderIdeas();
  if(t==="ask")renderSuggest();
  if(t==="notes")renderNotes();
  if(t==="info")renderInfo();
}
document.querySelectorAll("nav [data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$("noteAdd").onclick=addNote;
$("noteInput").addEventListener("keydown",e=>{if(e.key==="Enter")addNote();});
$("noteTag").innerHTML=NOTE_TAGS.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
$("showDoneBtn").onclick=()=>{showDone=!showDone;renderNotes();};
$("sheetClose").onclick=()=>$("sheet").classList.remove("on");
$("sheetCopy").onclick=async()=>{
  const ta=$("sheetText"); let ok=false;
  try{ await navigator.clipboard.writeText(ta.value); ok=true; }catch(e){}
  if(!ok){ try{ ta.focus(); ta.setSelectionRange(0,ta.value.length); ok=document.execCommand("copy"); }catch(e){} }
  $("sheetHint").textContent=ok
    ?"Copied — paste it into Notes or LINE now."
    :"Copy is blocked here: long-press the text → Select All → Copy.";
};
$("askGo").onclick=sendAsk;
$("askInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendAsk();}});

/* ---------------- boot ---------------- */
(function boot(){
  const today=jstISO();
  curDay=(DAYS.find(d=>d.iso===today)||DAYS[0]).iso;
  if(today>DAYS[DAYS.length-1].iso) curDay=DAYS[DAYS.length-1].iso;
  checks=lsGet("checks",{});
  bookings=lsGet("bookings",{});
  notes=lsGet("notes",[]);
  if(LITE){const b=document.querySelector('nav [data-tab="ask"]');if(b)b.style.display="none";}
  buildStrip(); renderPlan();
  setInterval(()=>{ if(curTab==="plan")renderPlan(); },60000);

  if(window.claude&&claude.use&&!LITE){
    claude.use("db").then(d=>{
      if(!d)return;
      db=d;
      sharedRef=db.doc("trip/shared");
      sharedRef.onSnapshot(snap=>{
        if(snap.exists){ const dd=snap.data(); checks=dd.checks||{}; if(dd.bookings) bookings=dd.bookings; }
        $("sync").classList.add("on"); $("syncTxt").textContent="synced";
        refreshChecksUI();
      },()=>{ $("sync").classList.remove("on"); $("syncTxt").textContent="local"; });
      notesCol=db.collection("notes");
      notesCol.orderBy("ts","desc").limit(200).onSnapshot(snap=>{
        notes=snap.docs.filter(x=>x.exists).map(x=>({id:x.id,...x.data()}));
        if(curTab==="notes")renderNotes();
      },()=>{});
    }).catch(()=>{});
    if(!LITE)claude.use("sample").then(s=>{
      if(s){ sampleFn=s; }
      else if(curTab==="ask"){ $("askOff").hidden=false; }
    }).catch(()=>{});
  }
})();
</script>
